name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: App icon
        run: npx --yes @capacitor/assets@3.0.5 generate --android --iconBackgroundColor '#13111d' --splashBackgroundColor '#13111d' || echo "Icon step skipped, default icon used"

      - name: Full screen, screen always on, portrait
        run: |
          cp android-extra/MainActivity.java android/app/src/main/java/com/livedeck/app/MainActivity.java
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Copy the app into Android
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LiveDeck-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
